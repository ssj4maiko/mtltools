# GET /api/chapter/autoUpdate/{idNovel}, GET /api/chapter/autoIndex/{idNovel},
# GET /api/chapter/{idNovel}/{no}/updateChapter, and GET /api/jobs/... (status / SSE).
# Other methods stay on PHP.
# ROLLBACK: comment out the include of this file in nginx.conf (one line).

location ~ ^/api/chapter/autoIndex/[0-9]+/?$ {
    if ($request_method != GET) {
        rewrite ^ /index.php last;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://node_api;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location ~ ^/api/chapter/autoUpdate/[0-9]+/?$ {
    if ($request_method != GET) {
        rewrite ^ /index.php last;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://node_api;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location ~ ^/api/chapter/[0-9]+/[0-9]+/updateChapter/?$ {
    if ($request_method != GET) {
        rewrite ^ /index.php last;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://node_api;
    proxy_read_timeout 120s;
}

location ~ ^/api/jobs(/|$) {
    if ($request_method != GET) {
        rewrite ^ /index.php last;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://node_api;
    proxy_read_timeout 60s;
    proxy_buffering off;
}
