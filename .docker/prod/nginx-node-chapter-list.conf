# GET /api/chapter/{idNovel} and GET /api/chapter/{idNovel}/{no},
# plus POST /api/chapter/{idNovel} and PUT/DELETE /api/chapter/{idNovel}/{no}.
# autoUpdate / updateChapter stay in nginx-node-kakuyomu-update.conf.
# ROLLBACK writes only: change the method checks below back to GET.
# ROLLBACK this whole group: comment out the include of this file in nginx.conf.
location ~ ^/api/chapter/[0-9]+/?$ {
    if ($request_method !~ ^(GET|POST)$) {
        rewrite ^ /index.php last;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://node_api;
    proxy_read_timeout 60s;
}

location ~ ^/api/chapter/[0-9]+/[0-9]+/?$ {
    if ($request_method !~ ^(GET|PUT|DELETE)$) {
        rewrite ^ /index.php last;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://node_api;
    proxy_read_timeout 60s;
}
