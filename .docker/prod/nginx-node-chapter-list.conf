# GET /api/chapter/{idNovel} and GET /api/chapter/{idNovel}/{no},
# plus POST /api/chapter/{idNovel} and PUT/DELETE /api/chapter/{idNovel}/{no}.
# autoUpdate / updateChapter stay in nginx-node-kakuyomu-update.conf.
location ~ ^/api/chapter/[0-9]+/?$ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://node_api;
    proxy_read_timeout 60s;
}

location ~ ^/api/chapter/[0-9]+/[0-9]+/?$ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://node_api;
    proxy_read_timeout 60s;
}
