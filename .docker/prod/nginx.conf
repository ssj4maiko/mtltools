user  nginx;
worker_processes  auto;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;
    error_log /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    client_max_body_size 512m;
    large_client_header_buffers 8 32k;

    upstream php {
        server php:9000;
    }

    upstream node_api {
        server backend:3000;
    }

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/api/public;

        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        index index.php;
        charset utf-8;

        # ROLLBACK: comment out the next include line to send GET /api/chapter/{id} and GET /api/chapter/{id}/{no} back to Laravel.
        include /etc/nginx/nginx-node-chapter-list.conf;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Chapter images extracted from base64 (content-addressed, immutable): /images/<h2>/<sha256>.<ext>
        location /images/ {
            alias /var/www/api/storage/app/public/images/;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass php;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;
            fastcgi_buffers 16 32k;
            fastcgi_buffer_size 64k;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
