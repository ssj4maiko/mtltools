user  nginx;
worker_processes  auto;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;
    error_log /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    client_max_body_size 512m;
    large_client_header_buffers 8 32k;

    upstream node_api {
        server backend:3000;
    }

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/public;

        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # SPA shell is public/index.html (the built Angular app).
        index index.html;
        charset utf-8;

        include /etc/nginx/nginx-node-chapter-list.conf;
        include /etc/nginx/nginx-node-catalog.conf;
        include /etc/nginx/nginx-node-static.conf;
        include /etc/nginx/nginx-node-kakuyomu-update.conf;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Chapter images extracted from base64 (content-addressed, immutable): /images/<h2>/<sha256>.<ext>
        location /images/ {
            alias /var/www/storage/app/public/images/;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.html;

        location ~ \.php$ {
            return 404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
