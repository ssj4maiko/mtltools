# GET catalog reads, POST /api/meta, and GET/PUT /api/cache/dictionary/{id}.
# Dictionary/category/entry writes (CRUD, fullSave, updatebycategory) also go to Node.
# Novel POST /api/novel and PUT/DELETE /api/novel/{id} also go to Node.
# and /api/novel/{id} below.

location ~ ^/api/novel/dictionary/[0-9]+/?$ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://node_api;
    proxy_read_timeout 60s;
}

