# GET catalog reads, POST /api/meta, and GET/PUT /api/cache/dictionary/{id}.
# Dictionary/category/entry writes (CRUD, fullSave, updatebycategory) also go to Node.
# Novel POST /api/novel and PUT/DELETE /api/novel/{id} also go to Node.
# /api/cache/chapter stays on PHP (unused by the frontend).
# ROLLBACK novel writes only: restore the GET-only method checks on /api/novel
# and /api/novel/{id} below.
# ROLLBACK this whole group: comment out the include of this file in nginx.conf.

location ~ ^/api/novel/dictionary/[0-9]+/?$ {
    if ($request_method != GET) {
        rewrite ^ /index.php last;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://node_api;
    proxy_read_timeout 60s;
}

location ~ ^/api/novel/?$ {
    if ($request_method !~ ^(GET|POST)$) {
        rewrite ^ /index.php last;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://node_api;
    proxy_read_timeout 60s;
}

