# GET /static/{idNovel}/{idDictionary}/{no} and /static/{idNovel}/{idDictionary}/{no}/{part}
# only (optional trailing slash). Other methods stay on PHP.
# ROLLBACK: comment out the include of this file in nginx.conf (one line).
location ~ ^/static/[0-9]+/[0-9]+/[0-9]+(/[0-9]+)?/?$ {
    if ($request_method != GET) {
        rewrite ^ /index.php last;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://node_api;
    proxy_read_timeout 60s;
}
