# Local production stack for mtltools.
# Public access: TLS is terminated by an external reverse proxy that forwards to this host on port 8800.
# Usage: docker compose -f docker-compose.prod.yml up -d
# Isolated from the dev stack (docker-compose.yml): own project name, network, DB data dir and storage dir.
name: mtltools-prod

services:
  nginx:
    image: nginx:1.27
    restart: unless-stopped
    depends_on:
      - php
      - backend
    networks:
      - mtltools-prod
    ports:
      - "8800:80"
    volumes:
      - ./:/var/www/api:ro
      - ./storage-prod:/var/www/api/storage:ro
      - ./.docker/prod/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.docker/prod/nginx-node-chapter-list.conf:/etc/nginx/nginx-node-chapter-list.conf:ro

  php:
    build:
      context: ./.docker/php
      args:
        development: "false"
        memory_limit: "512"
    image: mtltools-prod-php:latest
    user: "1000:1000"   # run as ssj4maiko so storage-prod / vendor stay owned by you
    restart: unless-stopped
    working_dir: /var/www/api
    env_file: .env.prod
    environment:
      HOME: /tmp
    depends_on:
      - db
    networks:
      - mtltools-prod
    volumes:
      - ./:/var/www/api
      # Laravel loads .env.<APP_ENV> = .env.production; inside this container it is the prod env file.
      # (The host's own .env.production is untouched; this mount only shadows it in the container.)
      - ./.env.prod:/var/www/api/.env.production:ro
      # Separate storage (logs, cache, sessions, chapter cache) so prod never mixes with dev.
      - ./storage-prod:/var/www/api/storage
      - ./.docker/prod/php.ini:/usr/local/etc/php/conf.d/99-prod.ini:ro


  backend:
    build:
      context: ./backend
    image: mtltools-prod-backend:latest
    user: "1000:1000"
    restart: unless-stopped
    env_file: .env.prod
    environment:
      PORT: "3000"
      CACHE_DIR: /app/cache
      DB_HOST: db
      DB_PORT: "3306"
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=96
    mem_limit: 128m
    memswap_limit: 128m
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mtltools-prod
    volumes:
      - ./storage-prod/app/node-cache:/app/cache
    ports:
      - "127.0.0.1:8801:3000"

  db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file: .env.prod.db
    networks:
      - mtltools-prod
    volumes:
      - ./DATABASE_PROD/:/var/lib/mysql/
      - ./.docker/prod/my.cnf:/etc/mysql/mariadb.conf.d/99-custom.cnf:ro   # max_allowed_packet=512M, innodb_buffer_pool_size=1G
    ports:
      - "127.0.0.1:33062:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  mtltools-prod:
    name: mtltools-prod
    driver: bridge
