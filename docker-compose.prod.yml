# Local production stack for mtltools.
# Public access: TLS is terminated by an external reverse proxy that forwards to this host on port 8800.
# Usage: docker compose -f docker-compose.prod.yml up -d
# Own project name, network, DB data dir and storage dir.
name: mtltools-prod

services:
  nginx:
    image: nginx:1.27
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - mtltools-prod
    ports:
      - "8800:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./storage-prod:/var/www/storage:ro
      - ./.docker/prod/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.docker/prod/nginx-node-chapter-list.conf:/etc/nginx/nginx-node-chapter-list.conf:ro
      - ./.docker/prod/nginx-node-catalog.conf:/etc/nginx/nginx-node-catalog.conf:ro
      - ./.docker/prod/nginx-node-static.conf:/etc/nginx/nginx-node-static.conf:ro
      - ./.docker/prod/nginx-node-kakuyomu-update.conf:/etc/nginx/nginx-node-kakuyomu-update.conf:ro

  backend:
    build:
      context: ./backend
    image: mtltools-prod-backend:latest
    user: "1000:1000"
    restart: unless-stopped
    env_file: .env.prod
    environment:
      PORT: "3000"
      CACHE_DIR: /app/cache
      DB_HOST: db
      DB_PORT: "3306"
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      LARAVEL_DICTIONARY_CACHE_DIR: /app/laravel-dictionary-cache
      LARAVEL_CHAPTER_CACHE_DIR: /app/laravel-chapter-cache
      IMAGES_DIR: /app/images
      IMAGE_EXTRACTION_DIR: /app/image-extraction
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mtltools-prod
    volumes:
      - ./storage-prod/app/node-cache:/app/cache
      - ./storage-prod/app/public/cache:/app/laravel-dictionary-cache
      - ./storage-prod/app/public/chapters:/app/laravel-chapter-cache
      - ./storage-prod/app/public/images:/app/images
      - ./storage-prod/app/image-extraction:/app/image-extraction
    ports:
      - "127.0.0.1:8801:3000"

  db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file: .env.prod.db
    networks:
      - mtltools-prod
    volumes:
      - ./DATABASE_PROD/:/var/lib/mysql/
      - ./.docker/prod/my.cnf:/etc/mysql/mariadb.conf.d/99-custom.cnf:ro   # max_allowed_packet=512M, innodb_buffer_pool_size=1G
    ports:
      - "127.0.0.1:33062:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  mtltools-prod:
    name: mtltools-prod
    driver: bridge
