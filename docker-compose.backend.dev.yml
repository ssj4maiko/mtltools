# Override for docker-compose.prod.yml. Temporarily runs the prod `backend`
# service with tsx watch and a bind-mounted src tree, still on the
# mtltools-prod network as hostname `backend`, so nginx on :8800 keeps working.
#
#   ./scripts/backend-tools.sh dev-on    # switch nginx's backend to tsx watch
#   ./scripts/backend-tools.sh dev-off   # switch back to the compiled image
#   ./scripts/backend-tools.sh deploy    # rebuild and redeploy compiled prod
services:
  backend:
    image: mtltools-backend-tools:latest
    build:
      context: ./backend
      target: tools
    user: "1000:1000"
    restart: unless-stopped
    env_file: .env.prod
    environment:
      PORT: "3000"
      CACHE_DIR: /app/cache
      DB_HOST: db
      DB_PORT: "3306"
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=192
      LARAVEL_DICTIONARY_CACHE_DIR: /app/laravel-dictionary-cache
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mtltools-prod
    volumes:
      - ./backend/src:/app/src
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./storage-prod/app/node-cache:/app/cache
      - ./storage-prod/app/public/cache:/app/laravel-dictionary-cache
    ports:
      - "127.0.0.1:8801:3000"
    working_dir: /app
    entrypoint: ["/usr/local/bin/backend-tools-entrypoint"]
    command: ["npx", "tsx", "watch", "src/server.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 8
