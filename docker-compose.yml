# Frontend toolchain only (Angular 13 on Node 18). The backend and the full stack live in
# docker-compose.prod.yml and docker-compose.backend*.yml.
#   docker compose up node-app                 # ng serve on :4200
#   scripts/frontend-build.sh                 # AOT production build into public/
services:
  node-app:
    build:
      context: ./.docker/node
    working_dir: /home/node/app
    entrypoint: bash -c "npm install && npm run startDev"
    ports:
      - "4200:4200"
    volumes:
      - ./resources/frontend:/home/node/app
