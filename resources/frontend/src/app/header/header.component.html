<header>
  <img src="assets/mtl-tools-logo.png" class="appName" alt="MTL Tools" routerLink="/" />
  <ul>
    <li routerLink="/dashboard" routerLinkActive="router-link-active">
      <a>Dashboard</a>
    </li>
    @for (breadcrumb of breadcrumbs; track breadcrumb) {
      <li [routerLink]="breadcrumb.url" routerLinkActive="router-link-active">
        <a>/ {{ breadcrumb.label }}</a>
      </li>
    }
  </ul>
</header>
