<div>
  <table class='table is-striped is-hoverable is-fullwidth novelTable dashboardNovels'>
    <thead>
      <tr>
        <th [ngClass]="{'orderedBy': currentSort.by == 'name'}">
          <span class="sortable" (click)="sort('name')">Name <i class="fas" [ngClass]="sortIcon('name')"></i></span>
        </th>
        <th class="colChapters" [ngClass]="{'orderedBy': currentSort.by == 'chapters'}" style="width:120px;">
          <span class="sortable" (click)="sort('chapters')">Chapters <i class="fas" [ngClass]="sortIcon('chapters')"></i></span>
        </th>
        <th style="width:75px">Status</th>
        <th style="width:75px">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (novel of visible; track novel.id) {
        @if (novel.show) {
          <tr title="{{ novel.nameOriginal }}" [ngClass]="{'disabled': updating[novel.id] }">
            <td class="ellipsis" [routerLink]="['/novel/', novel.id]" [title]="novel.nameOriginal">{{ novel.nameCustom }}</td>
            <td class="noChapters">{{ novel.numberChapters }}</td>
            <td class="status">
              @if (novel.completed) {
                <i class="fas fa-envelope has-text-success" title="Complete"></i>
              }
              @if (!novel.completed) {
                <i class="fas fa-envelope-open-text has-text-info" title="Still going"></i>
              }
              @if (novel.flagR18) {
                <i class="fas fa-user-secret has-text-danger" title="R18"></i>
              }
              @if (!novel.flagR18) {
                <i class="fas fa-user-secret has-text-grey-lighter" title="Everyone"></i>
              }
            </td>
            <td class="actions">
              <i class="fas fa-sync" [ngClass]="{'fa-spin': updating[novel.id]}" title="Update chapters" (click)="updateChapters(novel.id)">
              </i>
              <a [routerLink]="['/novel/edit', novel.id]">
                <i class="fas fa-edit"></i>
              </a>
            </td>
          </tr>
        }
      }
    </tbody>
  </table>
</div>
