<div>
  <table class='table is-striped is-hoverable is-fullwidth'>
    <thead>
      <tr>
        <th>Language</th>
        <th>#Categories</th>
      </tr>
    </thead>
    <tbody>
      @for (dictionary of dictionaries; track dictionary) {
        <tr [routerLink]="['/dictionary/', dictionary.id]">
          <td>{{ dictionary.name }}</td>
          <td class="count">{{ dictionary.countCategories() }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
